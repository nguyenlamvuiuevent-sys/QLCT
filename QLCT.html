<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKIP AND LOAFER — Monthly Afternoon Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      position: relative;
      overflow-x: hidden;
      /* Nền sọc dọc Vàng Chanh & Trắng tươi sáng như bìa tạp chí Monthly Afternoon */
      background: repeating-linear-gradient(
        90deg,
        #fef08a 0px,
        #fef08a 38px,
        #ffffff 38px,
        #ffffff 76px
      );
    }

    /* Thẻ Kính Mờ Kèm Viền Nổi Bật Bìa Tạp Chí */
    .magazine-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 2px solid #ff5376;
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 45px rgba(255, 83, 118, 0.2), 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .header-box {
      text-align: center;
      margin-bottom: 26px;
      position: relative;
    }

    /* Tag Nhãn Xanh Lá Neon / KC 10 OUT NOW */
    .subtitle-tag {
      display: inline-block;
      background: #22c55e;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      padding: 4px 12px;
      border-radius: 99px;
      text-transform: uppercase;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
    }

    /* Tiêu đề Hồng San Hô Rực Rỡ */
    .header-box h1 {
      font-family: 'Cinzel', serif;
      font-size: 30px;
      font-weight: 900;
      color: #ff5376;
      margin: 0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 1px 2px 0px rgba(254, 240, 138, 0.8);
    }

    .header-box p {
      font-size: 12px;
      color: #0284c7;
      margin-top: 8px;
      font-style: italic;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 10px;
      color: #ff5376;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1.5px solid #fde047;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    input::placeholder { color: #94a3b8; font-weight: 400; }

    input:focus, select:focus {
      border-color: #ff5376;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 83, 118, 0.18);
    }

    .currency-input { padding-right: 52px; }
    
    .currency-suffix {
      position: absolute;
      right: 16px;
      color: #ff5376;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    select option { background-color: #ffffff; color: #0f172a; }

    /* Nút Bấm Hồng San Hô Động Năng */
    .btn-submit {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff5376 0%, #e11d48 100%);
      color: #ffffff;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 22px rgba(255, 83, 118, 0.4);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.45);
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.8; cursor: not-allowed; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff5376;
      color: #ffffff;
      padding: 11px 24px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 12px 30px rgba(255, 83, 118, 0.4);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show { top: 24px; }
  </style>
</head>
<body>

<div id="toast" class="toast">Ghi nhận chi tiêu thành công</div>

<div class="magazine-card">
  <div class="header-box">
    <span class="subtitle-tag">MONTHLY AFTERNOON</span>
    <h1>SKIP & LOAFER</h1>
    <p>Ghi chép dòng tiền nhẹ nhàng & trong trẻo</p>
  </div>

  <form id="expenseForm">
    <div class="form-group">
      <label>Ngày chi tiêu</label>
      <input type="date" id="date" required>
    </div>
    
    <div class="form-group">
      <label>Khoản mục</label>
      <select id="category" required>
        <option value="Ăn uống">Ăn uống</option>
        <option value="Di chuyển">Di chuyển</option>
        <option value="Giải trí">Giải trí</option>
        <option value="Mua sắm">Mua sắm</option>
        <option value="Hóa đơn">Hóa đơn</option>
        <option value="Sức khỏe & Chăm sóc cá nhân">Sức khỏe & Chăm sóc cá nhân</option>
        <option value="Giáo dục">Giáo dục</option>
      </select>
    </div>

    <div class="form-group">
      <label>Số tiền</label>
      <div class="input-wrapper">
        <input type="text" id="amount" class="currency-input" placeholder="50,000" inputmode="numeric" required>
        <span class="currency-suffix">VND</span>
      </div>
    </div>

    <div class="form-group">
      <label>Thanh toán qua</label>
      <select id="payment">
        <option value="MOMO">MOMO</option>
        <option value="Tiền mặt">Tiền mặt</option>
        <option value="Sacombank">Sacombank</option>
      </select>
    </div>

    <div class="form-group">
      <label>Đánh giá</label>
      <select id="rating">
        <option value="Bình Thường">Bình Thường</option>
        <option value="Lãng Phí">Lãng Phí</option>
        <option value="Tiết Kiệm">Tiết Kiệm</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ghi chú</label>
      <input type="text" id="note" placeholder="Cà phê, đồ ăn...">
    </div>

    <button type="submit" id="btnSubmit" class="btn-submit">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Save Transaction</span>
    </button>
  </form>
</div>

<script>
  document.getElementById('date').valueAsDate = new Date();

  // API GOOGLE APPS SCRIPT ĐÃ DÁN SẴN:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOwN7UwZO0MJ8LGMh61Wj3DjXz90FsOAV0hPpzBeCWI725CreZoCPpmRyHKv9HJWq-/exec";

  const amountInput = document.getElementById('amount');
  amountInput.addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value) {
      e.target.value = Number(value).toLocaleString('en-US');
    } else {
      e.target.value = '';
    }
  });

  document.getElementById('expenseForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    btn.disabled = true;
    btnText.style.display = 'none';
    spinner.style.display = 'block';

    const rawAmount = amountInput.value.replace(/,/g, '');

    const payload = {
      date: document.getElementById('date').value,
      category: document.getElementById('category').value,
      amount: rawAmount,
      payment: document.getElementById('payment').value,
      rating: document.getElementById('rating').value,
      note: document.getElementById('note').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      // Pháo hoa rực rỡ sắc màu bìa tạp chí (Hồng, Vàng chanh, Xanh lá, Trắng)
      confetti({
        particleCount: 55,
        spread: 65,
        origin: { y: 0.8 },
        colors: ['#ff5376', '#facc15', '#22c55e', '#ffffff']
      });

      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);

      amountInput.value = '';
      document.getElementById('note').value = '';
    })
    .catch(err => alert("Có lỗi xảy ra khi gửi dữ liệu!"))
    .finally(() => {
      btn.disabled = false;
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
    });
  });
</script>

</body>
</html>
